name: tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.github/dependabot.yml'
      - '.github/workflows/lint.yml'
      - '.github/workflows/security-audit.yml'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.github/dependabot.yml'
      - '.github/workflows/lint.yml'
      - '.github/workflows/security-audit.yml'
      - '.gitignore'
      - '.editorconfig'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: jeffkaufman
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: projector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jeffkaufman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Enable pgvector Extension
        run: psql -h 127.0.0.1 -U jeffkaufman -d projector_test -c 'CREATE EXTENSION IF NOT EXISTS vector'

      - name: Tests
        run: ./vendor/bin/pest
