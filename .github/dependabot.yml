version: 2
updates:
  - package-ecosystem: composer
    directory: /
    target-branch: master
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      composer-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
